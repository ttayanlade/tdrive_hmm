[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdrive-hmm"
version = "1.0.0"
description = "3-State Gaussian HMM for T-Drive trajectory stop classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "hmmlearn>=0.3.0",
  "pyproj>=3.5",
  "joblib>=1.3",
  "pyarrow>=12.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tdrive-hmm = "tdrive_hmm.run_pipeline:main"

[tool.setuptools.packages.find]
include = ["tdrive_hmm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
